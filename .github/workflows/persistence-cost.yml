# Runs the persistence cost harness (`scripts/persistence-cost/`, ticket 17)
# against a real PostgreSQL, beside SQLite and memory on the same runner, and
# keeps the report as an artifact and in the job summary.
#
# A diagnostic, not a gate: it asserts no threshold, and it is kept out of
# `ci.yml` so the `ci` gate never depends on it and no ordinary run pays its
# minutes. It runs when the harness itself changes, so a change that breaks the
# harness is seen where it is made, and on demand from the Actions tab.
# Runner timings are noisy; read the numbers with the environment the report
# prints and the spread it gives, not as a benchmark of the product.
name: Persistence cost

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/persistence-cost/**
      - .github/workflows/persistence-cost.yml

permissions:
  contents: read

concurrency:
  group: persistence-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure persistence cost
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPORT_DIR: persistence-cost-report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The `postgres` job's own configuration, for the same reasons: the
      # compose image digest used locally, and a generated password.
      - name: Configure ephemeral PostgreSQL
        id: postgres-env
        run: |
          password="$(openssl rand -hex 32)"
          database_url="postgresql://hyper_ci:${password}@127.0.0.1:55432/hyper_ci"
          echo "::add-mask::$password"
          echo "::add-mask::$database_url"
          {
            echo "POSTGRES_DB=hyper_ci"
            echo "POSTGRES_USER=hyper_ci"
            echo "POSTGRES_PASSWORD=$password"
            echo "POSTGRES_PORT=55432"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: pnpm postgres:up

      - name: Migrate PostgreSQL
        run: pnpm contract:emit && pnpm db:migrate

      - name: Measure commits per Edit
        env:
          PERSISTENCE_COST_TARGETS: postgres,sqlite,memory
          PERSISTENCE_COST_SAMPLES: '20'
        run: |
          mkdir -p "$REPORT_DIR"
          pnpm exec tsx scripts/persistence-cost/measure.ts | tee "$REPORT_DIR/measure.md"

      - name: Measure aggregate-lock contention
        env:
          PERSISTENCE_COST_DURATION_MS: '10000'
          PERSISTENCE_COST_ROUNDS: '3'
        run: pnpm exec tsx scripts/persistence-cost/contention.ts | tee "$REPORT_DIR/contention.md"

      - name: Summarise
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "Commit ${HEAD_SHA}"
            echo
            cat "$REPORT_DIR"/*.md
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistence-cost-report
          path: persistence-cost-report/
          retention-days: 30

      - name: Show PostgreSQL logs
        if: failure() && steps.postgres-env.outcome == 'success'
        run: docker compose logs --no-color postgres

      - name: Stop PostgreSQL
        if: always() && steps.postgres-env.outcome == 'success'
        run: pnpm postgres:down
