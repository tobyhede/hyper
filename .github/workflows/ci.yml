# The bar `docs/agents/workflow.md` already sets, run by something other than a
# human remembering. Until now every gate in this repo — typecheck, lint,
# format, tests, e2e — was opt-in, which is why `playwright.config.ts` has
# carried `forbidOnly` and `retries` for a CI that did not exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, comments on a PR, or publishes.
permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to the commit its `v4` tag named when it was
      # added, because a tag can be repointed at new code and a SHA cannot. The
      # `postgres` job below puts a generated database password in the job
      # environment and then runs an install, so this is the difference between
      # trusting a commit and trusting whoever can move a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Keeps the job's token out of `.git/config`, where any dependency's
        # install script could read it.
        with: { persist-credentials: false }
      # No `version:` input on purpose — the action then reads `packageManager`
      # from package.json, so the pin cannot drift between here and a laptop.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # `--frozen-lockfile` is what turns the committed lockfile into a gate
      # rather than documentation.
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm verify

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Compose is deliberate here: CI exercises the exact image digest and
      # health check used locally, while a generated password keeps forked PRs
      # independent of repository secrets.
      - name: Configure ephemeral PostgreSQL
        id: postgres-env
        run: |
          password="$(openssl rand -hex 32)"
          database_url="postgresql://hyper_ci:${password}@127.0.0.1:55432/hyper_ci"
          echo "::add-mask::$password"
          echo "::add-mask::$database_url"
          {
            echo "POSTGRES_DB=hyper_ci"
            echo "POSTGRES_USER=hyper_ci"
            echo "POSTGRES_PASSWORD=$password"
            echo "POSTGRES_PORT=55432"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: pnpm postgres:up

      # This is the local/CI entry point: emit the contract, apply the complete
      # committed migration history, then run every PostgreSQL integration test.
      - name: Run PostgreSQL integration suite
        run: pnpm test:integration:postgres

      - name: Verify live database contract
        run: pnpm exec prisma-next db verify

      - name: Show PostgreSQL logs
        if: failure() && steps.postgres-env.outcome == 'success'
        run: docker compose logs --no-color postgres

      - name: Stop PostgreSQL
        if: always() && steps.postgres-env.outcome == 'success'
        run: pnpm postgres:down

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # The browser binaries are cached; the apt libraries they need are not,
      # since those live outside ~/.cache/ms-playwright.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
