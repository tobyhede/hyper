# The bar `docs/agents/workflow.md` already sets, run by something other than a
# human remembering. Until now every gate in this repo — typecheck, lint,
# format, tests, e2e — was opt-in, which is why `playwright.config.ts` has
# carried `forbidOnly` and `retries` for a CI that did not exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, comments on a PR, or publishes.
permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to the commit its tag named when it was added or
      # last bumped, because a tag can be repointed at new code and a SHA
      # cannot. The `postgres` job below generates a database password into the
      # job environment part-way through, and every action's post step then runs
      # at job end with it in scope, so this is the difference between trusting
      # a commit and trusting whoever can move a tag. Read the SHA off the
      # *commit*, not the ref: `pnpm/action-setup` tags are annotated, so
      # `git/ref/tags/<tag>` answers with the tag object.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token is never persisted, so no install script can find it. Which
        # file it would have been written to changed in checkout v6 — creds moved
        # out of `.git/config` into one of their own — and this setting is what
        # makes that irrelevant rather than merely less bad.
        with: { persist-credentials: false }
      # No `version:` input on purpose — the action then reads `packageManager`
      # from package.json, so the pin cannot drift between here and a laptop.
      # Still true in v6, and still `action-setup`: its successor `pnpm/setup`
      # requires pnpm v11 or newer and this repo pins pnpm 9.15.0.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # `cache: pnpm` is the explicit input and still supports pnpm. What v6
      # narrowed to npm was the *automatic* caching behind `package-manager-cache`,
      # which this never used. The `pnpm/action-setup` step above has to stay
      # first, or `setup-node` has no `pnpm store path` to cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # `--frozen-lockfile` is what turns the committed lockfile into a gate
      # rather than documentation.
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm verify

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Compose is deliberate here: CI exercises the exact image digest and
      # health check used locally, while a generated password keeps forked PRs
      # independent of repository secrets.
      - name: Configure ephemeral PostgreSQL
        id: postgres-env
        run: |
          password="$(openssl rand -hex 32)"
          database_url="postgresql://hyper_ci:${password}@127.0.0.1:55432/hyper_ci"
          echo "::add-mask::$password"
          echo "::add-mask::$database_url"
          {
            echo "POSTGRES_DB=hyper_ci"
            echo "POSTGRES_USER=hyper_ci"
            echo "POSTGRES_PASSWORD=$password"
            echo "POSTGRES_PORT=55432"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: pnpm postgres:up

      # This is the local/CI entry point: emit the contract, apply the complete
      # committed migration history, then run every PostgreSQL integration test.
      - name: Run PostgreSQL integration suite
        run: pnpm test:integration:postgres

      - name: Verify live database contract
        run: pnpm exec prisma-next db verify

      - name: Show PostgreSQL logs
        if: failure() && steps.postgres-env.outcome == 'success'
        run: docker compose logs --no-color postgres

      - name: Stop PostgreSQL
        if: always() && steps.postgres-env.outcome == 'success'
        run: pnpm postgres:down

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image, so nothing in this job reaches an apt mirror: the
    # browsers, the shared libraries they need and the font set are all baked
    # into its layers. It is the Ubuntu package path that is gone, not every
    # network fetch — `pnpm install` still reaches the npm registry, which is
    # why the pnpm store is cached below. The apt install this replaces was
    # pure downside — on
    # `ubuntu-latest` it found every library already present and fetched only
    # nine font packages (CJK, Thai, Cyrillic, unifont), which nothing here can
    # see because the suite takes no screenshots. It cost 11–23s of every run
    # and, once, 9m49s, when the Ubuntu mirror served those 21.1MB at 36kB/s.
    #
    # The digest is pinned for the same reason every action above is pinned to a
    # commit: a tag can be repointed at new content and a digest cannot. It is
    # the multi-arch index digest, so it resolves on any runner architecture.
    # **Docker resolves `repo:tag@digest` by the digest and ignores the tag**,
    # so the digest is the authoritative half and the tag beside it is a label
    # for human readers. Moving only the tag changes nothing and lies to the
    # next reader; move both, together with `@playwright/test` in the lockfile —
    # a three-way pairing that used to be derived from `node_modules` and is now
    # maintained by hand. Getting the lockfile ahead of the image is at least
    # loud: the image records its own name at build time (`playwright-core
    # mark-docker-image`), so `pnpm e2e` fails naming the current and required
    # tags. A guard step here would catch that a minute earlier at the cost of a
    # third place to edit, which is why there isn't one.
    #
    # `--ipc=host` and `--init` are both off Playwright's Docker guidance rather
    # than its Actions example, which carries neither. Without `--ipc=host` the
    # default 64MB `/dev/shm` makes Chromium run out of memory and crash, and
    # under `failOnFlakyTests` a crash is a red build rather than a retry.
    # `--init` supplies the child-process reaper, since PID 1 here is not ours:
    # Actions holds the container open for the whole job and runs each step
    # inside it, so an orphaned Chromium helper reparents onto a process that
    # never waits on it. What that example does carry is `--user 1001`, which
    # answers root-owned files in the mounted workspace — not a problem here,
    # because `upload-artifact` and the cache's save step both run inside the
    # container too, and the runner is ephemeral.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # No `actions/setup-node` here, unlike the other two jobs. The image brings
      # its own Node, and `setup-node`'s `cache: pnpm` would key a store resolved
      # under the container's `HOME` — `/github/home`, which Actions mounts and
      # sets for every `container:` job — against the key `verify` uses for
      # `/home/runner/…`, restoring each job's archive into the other's wrong
      # path. pnpm is the one thing the image lacks, so `action-setup` stays and
      # the store is cached below under a key that cannot collide.
      #
      # Losing `setup-node` also loses `.node-version` as this job's Node pin,
      # and nothing else enforces it: `.npmrc` sets no `engine-strict` and pnpm 9
      # does not check `engines` by default, so a `.node-version` bump would
      # otherwise land while e2e quietly kept running the image's older Node.
      # The check below restores that pin by reading the file rather than
      # repeating it, so it stays correct without becoming a literal to update.
      - name: The image's Node must satisfy .node-version
        run: |
          want="$(cut -d. -f1 < .node-version)"
          have="$(node -p 'process.versions.node.split(".")[0]')"
          [ "$want" = "$have" ] || {
            echo "::error::.node-version wants Node $want; the container ships $have. Move the image tag and digest to a Playwright image built on Node $want."
            exit 1
          }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-e2e-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ladle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADR 0052 makes a Ladle behaviour test half of every surface ticket's
    # acceptance evidence. Until this job existed nothing but a developer's
    # memory executed `pnpm e2e:ladle`, so the evidence accumulated ungated.
    #
    # It is its own job rather than a step in `verify` because `verify` —
    # typecheck, typecheck:packages, ui:catalog:check, lint, format:check,
    # test:coverage — has never needed a browser binary, runs on a plain
    # `ubuntu-latest`, and is the loop developers run constantly. Two commands,
    # two jobs. It is its own job rather than a second command in `e2e` because
    # a red catalogue and a red application are different diagnoses, and the
    # check name on a pull request should say which one failed.
    #
    # Every environment decision below is the `e2e` job's above, made for the
    # reasons its comments give and not repeated here: the same image pinned by
    # tag *and* digest (a bump moves both, together with `@playwright/test` in
    # the lockfile), `--ipc=host` for Chromium's `/dev/shm`, `--init` for the
    # helpers that reparent onto a PID 1 that is not ours, no
    # `actions/setup-node`, and the `.node-version` assertion that restores the
    # Node pin dropping `setup-node` would otherwise lose. Two things differ,
    # and both are commented where they appear: the cache key and the artifact
    # name.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: The image's Node must satisfy .node-version
        run: |
          want="$(cut -d. -f1 < .node-version)"
          have="$(node -p 'process.versions.node.split(".")[0]')"
          [ "$want" = "$have" ] || {
            echo "::error::.node-version wants Node $want; the container ships $have. Move the image tag and digest to a Playwright image built on Node $want."
            exit 1
          }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Its own key rather than `e2e`'s, although the two archives really are
      # interchangeable: both jobs are `container:` jobs, so both resolve the
      # store under `/github/home/…` and either could restore the other's.
      # Sharing would keep one copy, but on a cold run both jobs build the
      # store, both try to save it, and the loser logs a 409 — benign and noisy
      # on exactly the runs a reader is already reading the log. A second copy
      # against the repository's 10 GB cache limit is the cheaper of the two.
      # Sharing `verify`'s key is not on the table: it resolves its store under
      # `/home/runner/…`, so each job would restore the other's archive into a
      # path it never reads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-ladle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-ladle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      # Starts `ladle serve --noWatch` itself, so there is no build step here.
      - run: pnpm e2e:ladle

      # Its own artifact name. `upload-artifact` refuses a second upload under
      # a name already claimed in the same run, and both browser jobs can fail
      # in one run — sharing `playwright-report` would cost whichever finished
      # second its report, which is the run where you most want both.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
