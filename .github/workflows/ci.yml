# The bar `docs/agents/workflow.md` already sets, run by something other than a
# human remembering. Until now every gate in this repo — typecheck, lint,
# format, tests, e2e — was opt-in, which is why `playwright.config.ts` has
# carried `forbidOnly` and `retries` for a CI that did not exist.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, comments on a PR, or publishes.
permissions:
  actions: read
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-pr-ci:
    name: Reuse successful PR CI
    # Pull requests remain the source of truth. Only a push to main can reuse
    # their result, and a skipped or failed lookup leaves `should_skip` empty so
    # every test job below runs normally.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      should_skip: ${{ steps.skip-check.outputs.should_skip }}
    steps:
      # This action compares Git tree objects rather than commit SHAs, so a
      # clean merge, rebase or squash can reuse PR CI only when it produced the
      # exact same files. Cancellation and path backtracking are deliberately
      # disabled: this first use proves only identical-tree PR-to-main reuse.
      - name: Check whether this tree passed PR CI
        id: skip-check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          cancel_others: 'false'
          concurrent_skipping: never
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule", "merge_group"]'
          skip_after_successful_duplicate: 'true'

  static-checks:
    needs: reuse-pr-ci
    # `reuse-pr-ci` is skipped on every pull request, and a skipped `needs`
    # skips its dependents unless the default `success()` is overridden — hence
    # a condition here at all. `!cancelled()` rather than `always()` because the
    # two differ in exactly one case and `cancel-in-progress` above makes that
    # case routine: under `always()` a superseded run cancels and then starts
    # these jobs anyway, and the `ci` gate below reads five cancelled results
    # and reports a red *CI passed*. The four jobs after this one carry the
    # same condition for the same reason.
    if: ${{ !cancelled() && needs.reuse-pr-ci.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pnpm verify` is one serial chain of eight commands with very uneven
    # costs, and with `e2e` sharded it is the whole of this workflow's wall
    # clock. Measured on CI, where the chain takes 193s against 69s on a
    # laptop — about 2.8x:
    #
    #     typecheck:toolchain   ~3s      lint             ~59s
    #     typecheck             ~3s      lint:anti-slop    ~3s
    #     typecheck:packages    ~6s      format:check     ~11s
    #     ui:catalog:check      ~3s      test:coverage   ~106s
    #
    # Coverage is over half of it, which is the one place a split pays: the
    # seven commands here are ~87s and `coverage` below is ~106s, and each job
    # pays the ~28s of checkout and install the one job used to pay once — so
    # ~116s and ~134s side by side rather than a single ~221s run. It also makes
    # a red `tsc` and a red Vitest run two check names on a pull request rather
    # than one, which is the reason the `ladle` job below gives for existing at
    # all.
    #
    # **Two jobs and not three.** Splitting `lint` out as a third gives ~57s,
    # ~87s and ~134s, so the cap is this file's `coverage` job either way: the
    # third job lowers nothing and costs a third checkout, install and cache
    # restore. That is the shape of every further split — the cap belongs to
    # coverage until coverage itself gets cheaper.
    #
    # **The eight commands are listed in `package.json` and nowhere else.**
    # This job runs `verify:static`, which is the first seven in order;
    # `coverage` runs the eighth; and `pnpm verify` is defined as those two, so
    # a developer's one command and CI's two cannot drift apart. That is also
    # what keeps `typecheck:toolchain` first — it sits at the head of
    # `verify:static`, because a typecheck against the wrong compiler still
    # passes and proving which `tsc` ran has to happen before trusting what it
    # said — and what keeps `--prune-suppressions` on the `lint` this job runs.
    #
    # `contract:check` is not part of `verify` and rides here rather than in
    # `coverage` because it is another static check of the tree; running it in
    # both would pay for it twice to learn the same thing.
    steps:
      # Every action is pinned to the commit its tag named when it was added or
      # last bumped, because a tag can be repointed at new code and a SHA
      # cannot. The `postgres` job below generates a database password into the
      # job environment part-way through, and every action's post step then runs
      # at job end with it in scope, so this is the difference between trusting
      # a commit and trusting whoever can move a tag. Read the SHA off the
      # *commit*, not the ref: `pnpm/action-setup` tags are annotated, so
      # `git/ref/tags/<tag>` answers with the tag object.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The token is never persisted, so no install script can find it. Which
        # file it would have been written to changed in checkout v6 — creds moved
        # out of `.git/config` into one of their own — and this setting is what
        # makes that irrelevant rather than merely less bad.
        with: { persist-credentials: false }
      # No `version:` input on purpose — the action then reads `packageManager`
      # from package.json, so the pin cannot drift between here and a laptop.
      # Still true in v6, and still `action-setup`: its successor `pnpm/setup`
      # requires pnpm v11 or newer and this repo pins pnpm 9.15.0.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # `cache: pnpm` is the explicit input and still supports pnpm. What v6
      # narrowed to npm was the *automatic* caching behind `package-manager-cache`,
      # which this never used. The `pnpm/action-setup` step above has to stay
      # first, or `setup-node` has no `pnpm store path` to cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # `--frozen-lockfile` is what turns the committed lockfile into a gate
      # rather than documentation.
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm verify:static

  coverage:
    needs: reuse-pr-ci
    if: ${{ !cancelled() && needs.reuse-pr-ci.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The eighth command of `pnpm verify`, and the whole of this job. Read
    # `static-checks` above for the split, the measured costs behind it, and
    # why it is two jobs and not three. `test:coverage` is ~106s of the chain's
    # 193s, so this job — not that one, and no further split of it — is the
    # ~134s wall-clock cap the `e2e` shard arithmetic below is measured against.
    #
    # It shares `static-checks`' pnpm cache deliberately, and the key is the one
    # `setup-node`'s `cache: pnpm` derives from the lockfile: same runner image,
    # same `/home/runner/…` store path, same lockfile hash, so the two archives
    # would be byte-identical and a second key would buy a second copy of the
    # same bytes against the repository's 10 GB limit. `postgres` below already
    # shares it for that reason. On a cold run whichever job saves second logs a
    # 409 and skips the upload rather than spending it. This is the opposite
    # call from the two `container:` jobs further down, and only because they
    # resolve their store under `/github/home/…` and so cannot restore this
    # archive into a path they read.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  postgres:
    needs: reuse-pr-ci
    if: ${{ !cancelled() && needs.reuse-pr-ci.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Compose is deliberate here: CI exercises the exact image digest and
      # health check used locally, while a generated password keeps forked PRs
      # independent of repository secrets.
      - name: Configure ephemeral PostgreSQL
        id: postgres-env
        run: |
          password="$(openssl rand -hex 32)"
          database_url="postgresql://hyper_ci:${password}@127.0.0.1:55432/hyper_ci"
          echo "::add-mask::$password"
          echo "::add-mask::$database_url"
          {
            echo "POSTGRES_DB=hyper_ci"
            echo "POSTGRES_USER=hyper_ci"
            echo "POSTGRES_PASSWORD=$password"
            echo "POSTGRES_PORT=55432"
            echo "DATABASE_URL=$database_url"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: pnpm postgres:up

      # This is the local/CI entry point: emit the contract, apply the complete
      # committed migration history, then run every PostgreSQL integration test.
      - name: Run PostgreSQL integration suite
        run: pnpm test:integration:postgres

      - name: Verify live database contract
        run: pnpm exec prisma-next db verify

      - name: Show PostgreSQL logs
        if: failure() && steps.postgres-env.outcome == 'success'
        run: docker compose logs --no-color postgres

      - name: Stop PostgreSQL
        if: always() && steps.postgres-env.outcome == 'success'
        run: pnpm postgres:down

  e2e:
    needs: reuse-pr-ci
    if: ${{ !cancelled() && needs.reuse-pr-ci.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Three shards, and the number is arithmetic rather than taste. The suite is
    # CPU-saturated on one runner: 156 tests summing 382s of test time, and
    # raising Playwright's workers past cores/2 made it slower on *both* wall
    # clock and total work (98s at 4 workers, 110s at 8), so more workers on one
    # 4-vCPU runner is not a lever. Parallel efficiency at cores/2 is already
    # ~97%, which leaves only more machines. Against ~55s of fixed setup and the
    # ~134s the `verify` path is heading for:
    #
    #     shards   slowest shard        vs the ~134s cap
    #       1        202 + 55 = 257s     over
    #       2        101 + 55 = 156s     over
    #       3         67 + 55 = 122s     under  ← this
    #       4         50 + 55 = 105s     under, buys nothing
    #
    # Two is still over the cap and four is under a cap it is no longer the one
    # setting, so a fourth runner buys zero total CI wall clock. Standard runners
    # are free and unmetered on a public repository, which is why sharding at
    # this size is right here and wrong in the ecosystem's usual advice — the
    # alternative everyone reaches for, a larger runner, is billed even here.
    # The matrix list and the `/3` denominator on the `pnpm e2e` call below move
    # together.
    #
    # This works at all because `playwright.config.ts` sets `fullyParallel:
    # true`, so Playwright shards at test level rather than file level:
    # `--shard=i/3 --list` gives 52/52/52 even though `editing.spec.ts` alone
    # holds 73 of the 156 tests. File-level sharding would pin one shard to that
    # file and the split would be worthless.
    #
    # `fail-fast: false` because the default cancels the surviving shards the
    # moment one fails, and a cancelled shard uploads no report — losing exactly
    # the evidence a three-way failure exists to give you. It also keeps this
    # job's aggregate result unambiguously `failure` for the `ci` gate below
    # rather than a mixture the gate would have to reason about.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The container stays, and that was a decision rather than an oversight.
    # Dropping it would save ~25s of image pull per shard, taking each to ~95s —
    # under a cap that is already ~134s, so it buys zero wall clock, while
    # reversing the decision below and handing back the `install-deps` failure
    # mode that removed. Sharding is also not a reason to fear the container's
    # cost: each shard is its own 4-vCPU runner still running cores/2 workers,
    # so this lowers per-runner load rather than raising it.
    #
    # Playwright's own image, so nothing in this job reaches an apt mirror: the
    # browsers, the shared libraries they need and the font set are all baked
    # into its layers. It is the Ubuntu package path that is gone, not every
    # network fetch — `pnpm install` still reaches the npm registry, which is
    # why the pnpm store is cached below. The apt install this replaces was
    # pure downside — on
    # `ubuntu-latest` it found every library already present and fetched only
    # nine font packages (CJK, Thai, Cyrillic, unifont), which nothing here can
    # see because the suite takes no screenshots. It cost 11–23s of every run
    # and, once, 9m49s, when the Ubuntu mirror served those 21.1MB at 36kB/s.
    #
    # The digest is pinned for the same reason every action above is pinned to a
    # commit: a tag can be repointed at new content and a digest cannot. It is
    # the multi-arch index digest, so it resolves on any runner architecture.
    # **Docker resolves `repo:tag@digest` by the digest and ignores the tag**,
    # so the digest is the authoritative half and the tag beside it is a label
    # for human readers. Moving only the tag changes nothing and lies to the
    # next reader; move both, together with `@playwright/test` in the lockfile —
    # a three-way pairing that used to be derived from `node_modules` and is now
    # maintained by hand. Getting the lockfile ahead of the image is at least
    # loud: the image records its own name at build time (`playwright-core
    # mark-docker-image`), so `pnpm e2e` fails naming the current and required
    # tags. A guard step here would catch that a minute earlier at the cost of a
    # third place to edit, which is why there isn't one.
    #
    # **There are now two copies of this pin.** The `ladle` job below carries
    # the same tag and digest. A bump moves both, or that job silently keeps
    # running the old image: the `.node-version` check will not catch it, since
    # it compares the Node major and that is identical across Playwright image
    # versions. What surfaces instead is `pnpm e2e:ladle` failing on the
    # version the lockfile requires, which points a reader at the lockfile
    # rather than at the pin they forgot to move.
    #
    # `--ipc=host` and `--init` are both off Playwright's Docker guidance rather
    # than its Actions example, which carries neither. Without `--ipc=host` the
    # default 64MB `/dev/shm` makes Chromium run out of memory and crash, and
    # under `failOnFlakyTests` a crash is a red build rather than a retry.
    # `--init` supplies the child-process reaper, since PID 1 here is not ours:
    # Actions holds the container open for the whole job and runs each step
    # inside it, so an orphaned Chromium helper reparents onto a process that
    # never waits on it. What that example does carry is `--user 1001`, which
    # answers root-owned files in the mounted workspace — not a problem here,
    # because `upload-artifact` and the cache's save step both run inside the
    # container too, and the runner is ephemeral.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The image's Node is deliberately replaced from `.node-version`: ADR 0071
      # admits native Typed Array codecs that its Node 24 does not carry. The
      # image still owns the browsers and system libraries, and its exact tag
      # stays paired with `@playwright/test`. `setup-node` has no `cache: pnpm`
      # because that would key a store resolved
      # under the container's `HOME` — `/github/home`, which Actions mounts and
      # sets for every `container:` job — against the key the non-container jobs
      # use for `/home/runner/…`, restoring each job's archive into the other's
      # wrong path. pnpm is the one thing the image lacks, so `action-setup`
      # stays and the store is cached below under a key that cannot collide.
      #
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # **One key across all three shards, not one each** — the opposite call
      # from `ladle` below, for a reason that does not apply there. The shards
      # are one job: one image, one `HOME`, one lockfile hash, one store path,
      # so their archives would be byte-identical and three keys would buy three
      # copies of the same bytes. Restoring is not racy — only saving is, and
      # `actions/cache` reserves a key *before* uploading, so on a cold run the
      # two losers log a 409 and skip the upload rather than spending it and
      # discarding the result. Three keys would instead put three ~200MB uploads
      # on the critical path of the job whose entire purpose is wall clock. The
      # 409 is louder than the one `ladle` weighed — two per cold run rather
      # than one — and no less benign, and it happens only when
      # `pnpm-lock.yaml` moves. Sharing the non-container jobs' key remains off
      # the table for the reason `ladle`'s comment gives: they resolve their
      # store under `/home/runner/…` and every `container:` job under
      # `/github/home/…`.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-e2e-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      # Nothing about a shard changes a host's port: `packages/app/e2e` starts
      # one Vite host per *test* on `E2E_PORT_BASE + workerIndex` under
      # `strictPort`, and sharding does not change a shard's worker count. Each
      # shard is its own runner, so nothing is shared across the three anyway.
      - run: pnpm e2e --shard=${{ matrix.shard }}/3

      # Its own artifact name per shard. `upload-artifact` refuses a second
      # upload under a name already claimed in the same run — the trap the
      # `ladle` job below hit between two jobs, and worse here, because all
      # three shards can fail together and that is precisely the run where you
      # want all three reports.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ladle:
    needs: reuse-pr-ci
    if: ${{ !cancelled() && needs.reuse-pr-ci.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADR 0052 makes a Ladle behaviour test half of every surface ticket's
    # acceptance evidence. Until this job existed nothing but a developer's
    # memory executed `pnpm e2e:ladle`, so the evidence accumulated ungated.
    #
    # It is its own job rather than a step in the `verify` chain because that
    # chain — the `static-checks` and `coverage` jobs above, which between them
    # are exactly `pnpm verify` — has never needed a browser binary, runs on a
    # plain `ubuntu-latest`, and is the loop developers run constantly. A
    # different command earns a different job. It is its own job rather than a
    # second command in `e2e` because a red catalogue and a red application are
    # different diagnoses, and the check name on a pull request should say
    # which one failed.
    #
    # Every environment decision below is the `e2e` job's above, made for the
    # reasons its comments give and not repeated here: the same image pinned by
    # tag *and* digest (a bump moves both, together with `@playwright/test` in
    # the lockfile), `--ipc=host` for Chromium's `/dev/shm`, `--init` for the
    # helpers that reparent onto a PID 1 that is not ours, and `setup-node`
    # overlaying `.node-version` without taking over the pnpm cache. Two things differ,
    # and both are commented where they appear: the cache key and the artifact
    # name.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Resolve the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Its own key rather than `e2e`'s, although the two archives really are
      # interchangeable: both jobs are `container:` jobs, so both resolve the
      # store under `/github/home/…` and either could restore the other's.
      # Sharing would keep one copy, but on a cold run both jobs build the
      # store, both try to save it, and the loser logs a 409 — benign and noisy
      # on exactly the runs a reader is already reading the log. A second copy
      # against the repository's 10 GB cache limit is the cheaper of the two.
      # Sharing the non-container jobs' key is not on the table: they resolve
      # their store under `/home/runner/…`, so each job would restore the
      # other's archive into a path it never reads.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-ladle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-ladle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      # Starts `ladle serve --noWatch` itself, so there is no build step here.
      - run: pnpm e2e:ladle

      # Its own artifact name. `upload-artifact` refuses a second upload under
      # a name already claimed in the same run, and both browser jobs can fail
      # in one run — sharing `playwright-report` would cost whichever finished
      # second its report, which is the run where you most want both.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ci:
    name: CI passed
    needs: [reuse-pr-ci, static-checks, coverage, postgres, e2e, ladle]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `e2e` is a matrix and still reads as one `needs` result: Actions waits
      # for every shard and reports the job's aggregate, which is `failure` if
      # any shard failed. So the loop below needs no new entry and no new
      # dependency — one red shard fails the gate exactly as one red job did.
      # `fail-fast: false` on that matrix is what keeps the aggregate a clean
      # `failure` rather than a failure beside two cancellations, which matters
      # because `!cancelled()` above is about *this run* being superseded by
      # `cancel-in-progress`, not about a leg being abandoned mid-matrix.
      #
      # `static-checks` and `coverage` are two entries and not one for the same
      # reason they are two jobs: `pnpm verify` is required in full, so the gate
      # names both halves and a red half fails it exactly as the one `verify`
      # job did. Nothing here reads the two together — the halves are
      # independent, and a green one beside a red one is still a red gate.
      - name: Require reused or successful CI
        env:
          REUSED: ${{ needs.reuse-pr-ci.outputs.should_skip }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
          COVERAGE: ${{ needs.coverage.result }}
          POSTGRES: ${{ needs.postgres.result }}
          E2E: ${{ needs.e2e.result }}
          LADLE: ${{ needs.ladle.result }}
        run: |
          if [ "$REUSED" = "true" ]; then
            echo "All CI gates were reused from a successful run for the same Git tree."
            exit 0
          fi

          for result in "$STATIC_CHECKS" "$COVERAGE" "$POSTGRES" "$E2E" "$LADLE"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed: $result"
              exit 1
            fi
          done
