# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration. The rationale for every non-default value,
# the sources behind it and the options that were rejected are recorded in
# `.scratch/coderabbit-config/findings.md`.
#
# CodeRabbit reads this file from the branch under review, so a change to it is
# testable in the pull request that makes it.

# The house voice is Australian/British — `colour`, `behaviour`, `sanitised`,
# `emphasised` throughout AGENTS.md, CONTEXT.md and the ADRs. `en-US` would make
# every one of those a spelling finding.
language: 'en-AU'

tone_instructions: >-
  Terse and evidence-based. Cite the ADR, CONTEXT.md term or AGENTS.md rule a
  finding rests on. No praise and no restating what the code does. Say plainly
  when something is fine.

early_access: false

reviews:
  # `assertive` adds nitpicks; the repo already gates on `pnpm verify` and
  # `pnpm e2e` in CI, so the marginal nit is noise. Raise this if reviews feel
  # thin rather than to find more style comments.
  profile: 'chill'
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_instructions: >-
    Name the @project/* packages touched. State whether any ADR, CONTEXT.md
    vocabulary or AGENTS.md rule is affected, added or contradicted. Do not
    narrate what the code does.
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true

  # The issue tracker is markdown under `.scratch/`, not GitHub Issues, and the
  # repo has one committer — linked-issue assessment and reviewer suggestion
  # have nothing to read.
  assess_linked_issues: false
  related_issues: false
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false

  poem: false
  in_progress_fortune: false

  # The `autofix` skill consumes this block. Do not turn it off.
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords: ['WIP', 'DO NOT MERGE']

  # These drive a sparse checkout, so an exclusion also removes the file from
  # the context CodeRabbit can read. Exclude only artifacts a tool emits and
  # nobody edits. Do NOT exclude AGENTS.md, CONTEXT.md, docs/ or .scratch/ —
  # they are the review criteria.
  path_filters:
    - '!src/prisma/contract.json'
    - '!src/prisma/contract.d.ts'
    - '!migrations/**/*.json'
    - '!migrations/**/*.d.ts'

  path_instructions:
    # Repo-wide: which vocabulary is live, and which accepted ADR the code has
    # deliberately not caught up with. Both directions produce confident wrong
    # findings from a reviewer reading only the diff.
    - path: '**/*'
      instructions: >-
        ADR 0041 is BUILT. The live domain vocabulary is Graph, Graph
        navigation and Traversal history. The names it retired — Route and
        Walk, in any compound — survive only in the historical trees
        `docs/adr/`, `docs/superpowers/` and `.scratch/`, and in TanStack
        Router's own vocabulary in `packages/app/src/router.tsx`.
        `test/unit/current-domain-vocabulary.test.ts` scans every tracked file
        for them, so reintroducing one fails the build rather than the review.
        Qualified senses are kept and are not findings: Hono handles a request
        route, ELK produces routed geometry, a URL has one, and `path`
        identifiers are filesystem paths, router URLs or React Flow's
        `edge-path` class. Other retired vocabulary: `manifest`, `Arrangement`,
        a shared `Draft`, a `cards` array in the space file, an `edges` array
        beside Graphs.

        ADR 0040 is BUILT: `.scratch/first-public-aggregate/` landed it. A
        Layout's `graphs` are nested owned values and its position keys are its
        explicit Card membership; there is no Space-level Graph collection.
        `validateReferences` in `packages/graph/src/validate.ts` checks every
        owned Edge endpoint against that membership (`graph-edge-missing-card`,
        `graph-edge-card-outside-layout`). Do not report the aggregate as
        unbuilt or propose reverting to a Space-owned Graph collection.

    - path: 'packages/core/**'
      instructions: >-
        Zod schemas plus schema-derived types only. No React, no @xyflow/react,
        no elkjs, no framework dependency — ESLint enforces this, so a finding
        here means the rule was bypassed. Geometry rides as optional fields on
        elements (ADR 0005); there is no `Arrangement` type and none should be
        proposed. A Layout is authored data; a LayoutStrategy is behaviour
        living in `graph` (ADR 0014). Do not collapse them.

    - path: 'packages/graph/**'
      instructions: >-
        The package index is curated and there is no `export *`. Any new export
        must also be listed in `test/unit/graph-package-surface.test.ts` or the
        build fails — check the pull request does both. A test of an internal
        helper imports it from its own module, not through the index.
        `loadSpace` is the one intake (ADR 0010): it parses, validates
        references and indexes, does no I/O and stays synchronous. `Placement`
        construction is closed on purpose — a hand-built `new Map()` installed
        whole is the specific bug the branded type exists to prevent; do not
        suggest loosening it. Nothing in `placement.ts` may mutate an argument
        or hand two callers the same map.

    - path: 'packages/react-flow-adapter/**'
      instructions: >-
        React Flow is pinned to 12.11.2 and the behaviour below is verified
        against that release. Never suggest `useUpdateNodeInternals`: handle
        geometry is declared via `node.handles`, and the hook's forced path
        rebuilds `handleBounds` from the DOM, silently dropping every
        not-yet-incident handle declaration and breaking the NEXT connection.
        Never suggest `display: none` to hide a handle — React Flow measures
        handles and reports 0x0, so edges attach to the wrong point; use
        `opacity` or `visibility`. ELK port constraints are `FIXED_SIDE`, not
        `FIXED_ORDER` (clockwise ordering crosses every edge at a shared card).
        ELK port ids are namespaced `<cardId>##<handleId>`; a bare handle id
        mislays even a single-Graph graph. Handle ids stay `<graphId>::out` /
        `::in` — a per-side counter breaks React Flow's own resolution (#008).
        Do not tune global ELK options against the fixture screenshot.

    - path: 'packages/http/**'
      instructions: >-
        Fetch-native and portable: no Node built-ins, no Vite, no PostgreSQL, no
        app imports. Never call `context.notFound()` inside the handler
        `app.notFound()` installed — Hono re-enters it until the stack blows.
        Never rethrow from `onError` — Hono re-invokes the handler, `app.fetch()`
        rejects, and Node 24 kills the host process. Do not suggest Hono's
        `bodyLimit`: it trusts `Content-Length` and abandons a locked reader
        without draining, killing keep-alive; `requireBoundedCommitBody` counts
        arriving bytes and drains up to `MAX_DRAINED_BODY_BYTES` instead. Do not
        reintroduce a declared-length pre-check. Keep the single canonical media
        policy in `requireSupportedRequestMedia` — Hono's json validator
        silently yields `{}` on a header it dislikes. A decoder whose error
        reaches a client must summarise issues, never ship `Zod.parse` prose.

    - path: 'packages/persistence/**'
      instructions: >-
        `submit` decides from `state.working`, never from its argument — an
        observer may legally submit from inside a publication, and deciding from
        the argument stores the older snapshot last. Do not replace the identity
        check with a per-call guard. `publish` contains observer failures and
        must not rethrow. The server seam is a superset of the browser seam
        declared once in `src/repository.ts`; do not add a second declaration.
        Every committed snapshot goes through normal domain intake.

    - path: 'packages/app/src/**'
      instructions: >-
        Composition only. Zustand belongs to the render adapter and nothing
        else; Traversal history lives in Navigation. Never put a derived array
        in a store selector, and do not `useMemo` `Navigation.moves()` — it
        reads current state through Navigation and a memo goes stale exactly
        when a newly drawn Edge should become traversable. In `space-authoring`,
        `session.submit` is deliberately the first statement of the install
        shell and the only fallible one; do not reorder it or re-check the
        Graph/Layout inside that window. The install gate counts depth and
        publishes in the `finally` — a boolean flag republishes part-way state.
        `beforeunload` is registered only while persistence is unsettled and
        calls `preventDefault()` alone; `event.returnValue` is deprecated.
        `resolveView` is the one seam answering the subject and the Active
        Graph, and both fallbacks live there; Navigation takes that answer as
        an argument rather than reaching for the Space's first Graph, because
        two places answering it would disagree the moment a Layout filters.
        There is no Save action, and card markdown stays behind DOMPurify.

    - path: '{,packages/*/}*.config.ts'
      instructions: >-
        A module bundled into a Vite config imports `@project/*` by RELATIVE
        path only. Vite externalizes bare specifiers and hands Node the
        workspace TypeScript, whose extensionless imports Node's ESM resolver
        rejects — the config then fails to load and the dev server will not
        start. This is the one place the extensionless-relative-import
        convention does not apply.

    - path: 'packages/app/vite*.ts'
      instructions: >-
        Same rule as the root configs: `@project/*` by relative path only, or
        the dev server will not start. Vite needs no `@project/*` alias — it
        resolves through the workspace `exports`; do not add a third alias list
        beside `tsconfig.base.json` and `vitest.config.ts`.

    - path: '{packages/*/test/**,test/**,**/*.{test,spec}.{ts,tsx}}'
      instructions: >-
        Vitest with fast-check for properties — never suggest Jest APIs.
        Non-null assertions are deliberately allowed in tests. Coverage
        thresholds are per-package and pinned at what already holds; a change
        that lowers one needs a reason in the pull request.

    - path: 'packages/app/e2e/**'
      instructions: >-
        Playwright, Chromium only, database-free, exercising the HTTP boundary.
        Every test owns a fresh Vite host, `E2eMemorySpaceRepository` and
        catalog on a worker-scoped port from 5300 up — do not suggest sharing
        state between tests or reusing the developer's 5173-5175 servers.

    - path: '.github/workflows/**'
      instructions: >-
        Every action stays pinned to a commit SHA with the version as a trailing
        comment — do not suggest a floating tag. Keep `permissions` least
        privilege and `persist-credentials: false` on checkout. The PostgreSQL
        job generates and masks its own password so forked pull requests need no
        repository secret; do not propose a secret in its place.

    - path: '{migrations/**,src/prisma/**}'
      instructions: >-
        Prisma Next 0.16.0 emits these artifacts and owns their shape — do not
        suggest editing them; raise a concern about the source schema instead.
        Two pinned workarounds are deliberate and documented in
        `docs/agents/editing-and-persistence.md`: the
        four exact `@prisma-next/*` root devDependencies exist only so generated
        types resolve under pnpm's strict layout, and the single `int8`
        compatibility cast in `toDatabaseRevision` keeps revisions as `bigint`.
        Do not propose removing either, and never convert a revision through
        `Number`.

    - path: 'docs/adr/**'
      instructions: >-
        ADRs are a decision record. Historical and superseded ADR bodies keep
        their original wording as provenance — do not suggest rewriting them to
        current vocabulary. A changed decision is a new ADR plus refinement
        links in both directions, not an edit to the old one.

    - path: '.scratch/**/*.md'
      instructions: >-
        The local markdown issue tracker (`docs/agents/issue-tracker.md`).
        Resolved issue bodies retain the vocabulary of their time; do not
        suggest renaming them. Review these for whether the stated decision is
        sound, not for prose style.

    - path: '{.agents/skills/**,.claude/skills/**}'
      instructions: >-
        Vendored third-party agent skills, pinned by `skills-lock.json`. Do not
        suggest edits to their content. Do flag anything security-relevant in a
        change: new tool or shell invocations, network access, credential or
        environment reads, instructions that would exfiltrate repository
        contents, and any drift between the files and `skills-lock.json`.

  finishing_touches:
    # The house style is prose comments that explain why, in the voice of the
    # surrounding code. Generated docstrings fight that.
    docstrings:
      enabled: false
    unit_tests:
      enabled: true
    simplify:
      enabled: false
    autofix:
      enabled: true

  pre_merge_checks:
    # No docstrings anywhere; an 80% coverage warning on every pull request is
    # pure noise.
    docstrings:
      mode: 'off'
    title:
      mode: 'warning'
      requirements: >-
        Imperative mood, lower case after any `type:` prefix, under 72
        characters. States the change, not the area touched.
    description:
      mode: 'warning'
    # No GitHub Issues in this repo.
    issue_assessment:
      mode: 'off'
    custom_checks:
      - name: 'Verification evidence'
        mode: 'warning'
        instructions: >-
          The pull request description must report the real output of `pnpm
          verify`, and of `pnpm e2e` as well when any UI, graph, canvas or
          rendering code changed. A claim of success with no command output
          fails this check. A documented failure with an explanation passes.
      - name: 'Decision records'
        mode: 'warning'
        instructions: >-
          A change that contradicts, supersedes or extends an accepted ADR must
          add a new ADR under `docs/adr/` with refinement links in both
          directions, or update AGENTS.md where it records build status. Silent
          divergence from an accepted ADR fails this check. Ordinary changes
          that implement an already-accepted ADR pass.
      - name: 'Domain vocabulary'
        mode: 'warning'
        instructions: >-
          New identifiers and prose use the vocabulary in CONTEXT.md. Retired
          terms must not reappear: the names ADR 0041 retired (Route and Walk,
          in any compound), `manifest`, `Arrangement`, a shared `Draft`, a
          `cards` array in the space file, or an `edges` array beside Graphs.
          `test/unit/current-domain-vocabulary.test.ts` already enforces the
          first of those over every tracked file; this check covers the rest. A
          new domain term, or a renamed one, needs a CONTEXT.md entry in the
          same pull request.

  tools:
    # ESLint is skipped for this repo whatever this says: the flat config uses
    # `eslint-plugin-react-refresh`, which is not on CodeRabbit's allow-list,
    # and CodeRabbit skips the run entirely when a config names a plugin outside
    # it. Type-aware rules — which is nearly the whole config — are disabled
    # there too. Off, so the no-op is explicit. CI's `--max-warnings=0` is the
    # authority.
    eslint:
      enabled: false
    # One linter's opinions per repo. ESLint plus Prettier is the house style.
    biome:
      enabled: false
    oxc:
      enabled: false
    # Markdown is excluded from Prettier on purpose and the repo carries ~240KB
    # of deliberately formatted prose. Default markdownlint rules would flood
    # every documentation pull request. Re-enable only alongside a committed
    # `.markdownlint.json` that matches the existing style.
    markdownlint:
      enabled: false
    # Same reason. With this much authored prose, grammar findings would be the
    # dominant output of every review.
    languagetool:
      enabled: false
    # Five YAML files, no `.yamllint`. Default rules (line length, truthy,
    # comment spacing) are all style, and actionlint plus zizmor already cover
    # the file that matters.
    yamllint:
      enabled: false
    # `contract.prisma` is emitted by `prisma-next contract emit`; lint findings
    # on it are unactionable.
    prismaLint:
      enabled: false
    # `compose.yaml` is a local development PostgreSQL service, not deployed
    # infrastructure. Re-enable when real deployment manifests land.
    checkov:
      enabled: false
    trivy:
      enabled: false

    # Kept on deliberately.
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    dotenvLint:
      enabled: true
    reactDoctor:
      enabled: true
    # The repo tracks vendored agent skills; a SKILL.md is an injection surface.
    skillspector:
      enabled: true
    ast-grep:
      essential_rules: true
    # CI runs verify, a PostgreSQL integration suite and Playwright. The 90s
    # default expires long before those conclude, so CodeRabbit reviews without
    # knowing what failed. 15 minutes is the maximum.
    github-checks:
      enabled: true
      timeout_ms: 900000

chat:
  art: false
  auto_reply: true
  integrations:
    jira:
      usage: 'disabled'
    linear:
      usage: 'disabled'

knowledge_base:
  opt_out: false
  # Useful here: it can check whether the pinned React Flow 12.11.2, Hono and
  # Prisma Next 0.16.0 workarounds still hold upstream.
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    # Defaults already pick up `**/AGENTS.md` and `**/CLAUDE.md` (a symlink to
    # it). These add the domain model and the tracker conventions, scoped to
    # what they actually govern — `filePatterns` supplements the defaults rather
    # than replacing them.
    filePatterns:
      - files: 'CONTEXT.md'
        applyTo: '**/*'
      - files: 'docs/agents/workflow.md'
        applyTo: '**/*'
      - files: 'docs/agents/issue-tracker.md'
        applyTo: '.scratch/**/*.md'
      - files: 'docs/agents/domain.md'
        applyTo: 'docs/adr/**/*.md,CONTEXT.md'
      - files: 'docs/agents/editing-and-persistence.md'
        applyTo: 'packages/persistence/**,packages/graph/**,packages/app/src/space-authoring.ts,migrations/**,src/prisma/**'
      - files: 'docs/agents/rendering.md'
        applyTo: 'packages/react-flow-adapter/**,packages/app/src/components/**,packages/app/src/edge-authoring*.ts,packages/app/src/canvas-projection.ts,packages/app/src/render-adapter.ts,packages/app/src/camera.ts'
      - files: 'docs/agents/http.md'
        applyTo: 'packages/http/**'
      - files: 'docs/agents/ui.md'
        applyTo: 'packages/ui/**,packages/app/src/components/**'
      - files: 'docs/agents/build-tooling.md'
        applyTo: '{,packages/*/}*.config.ts,packages/app/vite*.ts'
  # One prototype repository; nothing should bleed in from or out to another.
  learnings:
    scope: 'local'
  issues:
    scope: 'local'
  pull_requests:
    scope: 'local'
  jira:
    usage: 'disabled'
  linear:
    usage: 'disabled'

code_generation:
  unit_tests:
    path_instructions:
      - path: 'packages/**'
        instructions: >-
          Vitest, with fast-check for properties. Unit and property tests live
          in that package's own `test/` directory, never beside the source. A
          test of an internal helper imports it from its own module rather than
          through the package index. Never generate Jest APIs.
